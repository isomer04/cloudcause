[project]
name = "cloudcause-rate-limit"
version = "0.1.0"
description = "Rate limiting: token buckets, concurrency permits, and the outbound AI request governor"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_rate_limit"]
