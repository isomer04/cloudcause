[project]
name = "cloudcause-anomaly-detection"
version = "0.1.0"
description = "Deterministic period comparison, materiality filtering, and cost reconciliation"
requires-python = ">=3.11"
dependencies = ["cloudcause-contracts", "cloudcause-focus-normalizer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_anomaly"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-focus-normalizer = { workspace = true }
