[project]
name = "cloudcause-focus-normalizer"
version = "0.1.0"
description = "Provider cost parsers and FOCUS 1.4 normalization"
requires-python = ">=3.11"
dependencies = ["cloudcause-contracts", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_focus"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
