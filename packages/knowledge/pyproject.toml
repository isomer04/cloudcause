[project]
name = "cloudcause-billing-knowledge"
version = "0.1.0"
description = "Versioned, date-aware billing knowledge store for CloudCause"
requires-python = ">=3.11"
dependencies = ["cloudcause-contracts", "cloudcause-focus-normalizer", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_knowledge"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-focus-normalizer = { workspace = true }
