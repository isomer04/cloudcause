[project]
name = "cloudcause-datasets"
version = "0.1.0"
description = "Uploaded dataset ingest and the shared store every process reads it from"
requires-python = ">=3.11"
dependencies = ["cloudcause-contracts", "cloudcause-focus-normalizer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_datasets"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-focus-normalizer = { workspace = true }
