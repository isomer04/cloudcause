[project]
name = "cloudcause-providers"
version = "0.1.0"
description = "Provider adapter boundary: fixture, scenario, upload, and (future) live read-only data providers"
requires-python = ">=3.11"
dependencies = [
    "cloudcause-contracts",
    "cloudcause-focus-normalizer",
    "cloudcause-datasets",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_providers"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-focus-normalizer = { workspace = true }
cloudcause-datasets = { workspace = true }
