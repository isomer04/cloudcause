[project]
name = "cloudcause-evidence-validation"
version = "0.1.0"
description = "Rejects or downgrades findings that evidence does not support"
requires-python = ">=3.11"
dependencies = ["cloudcause-contracts", "cloudcause-anomaly-detection"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_evidence"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-anomaly-detection = { workspace = true }
