[project]
name = "cloudcause-mcp-servers"
version = "0.1.0"
description = "Read-only MCP servers: provider operational data and billing knowledge"
requires-python = ">=3.11"
dependencies = [
    "cloudcause-contracts",
    "cloudcause-providers",
    "cloudcause-billing-knowledge",
    "cloudcause-anomaly-detection",
    "cloudcause-datasets",
    "mcp>=1.2",
]

[project.scripts]
cloudcause-mcp-operational = "cloudcause_mcp.operational_server:main"
cloudcause-mcp-knowledge = "cloudcause_mcp.knowledge_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_mcp"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-providers = { workspace = true }
cloudcause-billing-knowledge = { workspace = true }
cloudcause-anomaly-detection = { workspace = true }
cloudcause-datasets = { workspace = true }
