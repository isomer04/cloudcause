[project]
name = "cloudcause"
version = "0.1.0"
description = "CloudCause - multi-cloud cost spike investigator (workspace root)"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "cloudcause-contracts",
    "cloudcause-focus-normalizer",
    "cloudcause-anomaly-detection",
    "cloudcause-billing-knowledge",
    "cloudcause-datasets",
    "cloudcause-providers",
    "cloudcause-evidence-validation",
    "cloudcause-rate-limit",
    "cloudcause-worker-core",
    "cloudcause-mcp-servers",
    "cloudcause-investigator-aws-strands",
    "cloudcause-investigator-azure-maf",
    "cloudcause-orchestrator-adk",
    "cloudcause-api",
]

[project.optional-dependencies]
# The PostgreSQL driver, needed only to persist anything: history and the shared
# dataset store both default to memory, which is what an offline run uses.
postgres = [
    "psycopg[binary]>=3.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
    # Text extraction for PDF renderer tests only; never imported by app code.
    "pypdf>=4.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "api"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-focus-normalizer = { workspace = true }
cloudcause-anomaly-detection = { workspace = true }
cloudcause-billing-knowledge = { workspace = true }
cloudcause-datasets = { workspace = true }
cloudcause-providers = { workspace = true }
cloudcause-evidence-validation = { workspace = true }
cloudcause-rate-limit = { workspace = true }
cloudcause-worker-core = { workspace = true }
cloudcause-mcp-servers = { workspace = true }
cloudcause-investigator-aws-strands = { workspace = true }
cloudcause-investigator-azure-maf = { workspace = true }
cloudcause-orchestrator-adk = { workspace = true }
cloudcause-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: requires model API keys and real agent frameworks (excluded from offline CI)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Third-party course material. Untracked (see .gitignore) but excluded here so a
# local copy never shows up in lint output.
extend-exclude = ["course_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Azure and GCP resource ids are long and must stay verbatim.
"tests/**" = ["E501"]
"evaluations/**" = ["E501"]
