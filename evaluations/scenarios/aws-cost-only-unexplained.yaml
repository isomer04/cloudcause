notes: >
  The billing export is the only source available: no inventory, no metrics, no
  audit trail, no provider recommendations. The queue spend genuinely moved and
  CloudCause measures it exactly, but nothing on hand can name the mechanism, so
  it must publish unexplained_increase at low confidence and say which sources
  would settle it. This is the invariant "cost does not prove cause" made
  visible; it is a scenario precisely so a reviewer can click it.
