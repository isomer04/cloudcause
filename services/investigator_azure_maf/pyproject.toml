[project]
name = "cloudcause-investigator-azure-maf"
version = "0.1.0"
description = "Azure cost investigator built on Microsoft Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "cloudcause-contracts",
    "cloudcause-worker-core",
    "cloudcause-mcp-servers",
    # Not `agent-framework`: that distribution is a 6 KB shim whose only
    # dependency is agent-framework-core[all], and `all` pulls 29 provider
    # integrations -- Claude, Copilot Studio, Bedrock, Gemini, Mistral, Ollama,
    # Redis, DevUI -- none of which this service imports. They cost roughly
    # 500 MB in the container image, which Cloud Run pays for on every cold
    # start. Core plus the OpenAI client is exactly what live_agent.py uses.
    "agent-framework-core>=1.0.0b1",
    "agent-framework-openai>=1.0.0b1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
cloudcause-azure-worker = "cloudcause_azure.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_azure"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-worker-core = { workspace = true }
cloudcause-mcp-servers = { workspace = true }
