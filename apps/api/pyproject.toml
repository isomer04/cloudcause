[project]
name = "cloudcause-api"
version = "0.1.0"
description = "CloudCause FastAPI gateway: the only contract the UI talks to"
requires-python = ">=3.11"
dependencies = [
    "cloudcause-contracts",
    "cloudcause-datasets",
    "cloudcause-providers",
    "cloudcause-worker-core",
    "cloudcause-orchestrator-adk",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.scripts]
cloudcause-api = "cloudcause_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcause_api"]

[tool.uv.sources]
cloudcause-contracts = { workspace = true }
cloudcause-datasets = { workspace = true }
cloudcause-providers = { workspace = true }
cloudcause-worker-core = { workspace = true }
cloudcause-orchestrator-adk = { workspace = true }
