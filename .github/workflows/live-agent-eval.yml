name: live-agent-evaluation

# Opt-in quality gate for the real Google ADK, Microsoft Agent Framework, and
# AWS Strands paths. This spends model tokens and is deliberately separate from
# the deterministic evaluation that runs on every pull request.
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Independent runs per live-agent test to expose nondeterminism
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "5"]

permissions:
  contents: read

concurrency:
  group: live-agent-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-evaluation
    env:
      CLOUDCAUSE_DATA_MODE: fixtures
      CLOUDCAUSE_AGENT_MODE: live
      CLOUDCAUSE_ORCHESTRATOR_MODE: inprocess
      CLOUDCAUSE_WORKER_MODE: inprocess
      GOOGLE_GENAI_USE_ENTERPRISE: "FALSE"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require live-model credentials
        shell: bash
        run: |
          [[ -n "$OPENAI_API_KEY" ]] || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          [[ -n "$GOOGLE_API_KEY" ]] || { echo "GOOGLE_API_KEY is not configured"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --frozen

      - name: Run live-agent evaluation
        shell: bash
        run: |
          mkdir -p reports
          for run in $(seq 1 "${{ inputs.repetitions }}"); do
            echo "=== repetition $run/${{ inputs.repetitions }} ===" | tee -a reports/live-agent-evaluation.txt
            uv run pytest tests/live -m live -q | tee -a reports/live-agent-evaluation.txt
          done

      - name: Publish live-agent summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Live AI Agent Evaluation"
            echo
            echo "Hosted-model run using fixture evidence and deterministic validation."
            echo
            echo '```text'
            if [[ -f reports/live-agent-evaluation.txt ]]; then
              cat reports/live-agent-evaluation.txt
            else
              echo "The live evaluation stopped before producing test output."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live-agent results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-evaluation-${{ github.run_id }}
          path: reports/live-agent-evaluation.txt
          if-no-files-found: warn
          retention-days: 30
