name: provider-docs-change-check

# Weekly signal, never an automatic rule change. See docs/billing-knowledge.md
# section 5, "Controlled update workflow".
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Compare official documentation against the recorded baseline
        id: check
        continue-on-error: true
        run: |
          uv run python scripts/check_provider_docs.py --report reports/docs-change.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the report
        run: cat reports/docs-change.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-change-report
          path: reports/docs-change.md

      - name: Open a review issue when something changed
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Provider billing documentation changed ($(date -u +%Y-%m-%d))" \
            --body-file reports/docs-change.md \
            --label documentation
